name: Check company links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"   # monthly
  push:
    paths: ["data/companies.json"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_links.py
